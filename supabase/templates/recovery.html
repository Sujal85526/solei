<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      background: #f6eee8;
      font-family: Georgia, &quot;Times New Roman&quot;, serif;
      color: #24030f;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f6eee8; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 520px; background: #fbf6f2; border: 1px solid #e7d6cb"
          >
            <tr>
              <td
                style="
                  background: #460328;
                  padding: 28px;
                  text-align: center;
                  color: #f7cdd0;
                  font-size: 30px;
                  letter-spacing: 1px;
                "
              >
                solei
              </td>
            </tr>
            <tr>
              <td style="padding: 36px 32px">
                <h1 style="margin: 0 0 16px; font-weight: normal; font-size: 26px; color: #460328">
                  Reset your password
                </h1>
                <p
                  style="
                    margin: 0 0 28px;
                    font-family: Helvetica, Arial, sans-serif;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #6a4655;
                  "
                >
                  We received a request to reset your Solei password. If this wasn't you, you can
                  ignore this email.
                </p>
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/admin/set-password"
                  style="
                    display: inline-block;
                    background: #460328;
                    color: #f6eee8;
                    text-decoration: none;
                    padding: 14px 26px;
                    font-family: Helvetica, Arial, sans-serif;
                    font-size: 12px;
                    letter-spacing: 3px;
                    text-transform: uppercase;
                  "
                  >Choose a new password</a
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 32px;
                  border-top: 1px solid #e7d6cb;
                  font-family: Helvetica, Arial, sans-serif;
                  font-size: 12px;
                  color: #6a4655;
                  text-align: center;
                "
              >
                Solei · Abu Dhabi · Made to remain.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
